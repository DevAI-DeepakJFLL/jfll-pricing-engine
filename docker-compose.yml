services:
  pricing-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: air-export-pricing-engine:latest
    container_name: air-export-pricing-engine
    ports:
      - "5050:5050"
    environment:
      - AWS_REGION=ap-south-1
      - S3_BUCKET_NAME=air-export-pricing-models
      - ALLOW_SKLEARN_MISMATCH=1
    restart: unless-stopped
