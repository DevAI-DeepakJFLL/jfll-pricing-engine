services:
  pricing-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: air-export-pricing-engine:latest
    container_name: air-export-pricing-engine
    ports:
      - "5050:5050"
      - "5055:5050"
    environment:
      - AWS_ENDPOINT_URL=http://host.docker.internal:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - S3_BUCKET_NAME=air-export-pricing-models
      - SYNC_MODEL_FROM_S3=1
      - ALLOW_SKLEARN_MISMATCH=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
