name: Deploy Air Export Pricing Engine to AWS Free Tier

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: aws-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests & Vocabulary Alignment Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt moto[s3]

      - name: Verify Categorical Vocabulary Alignment (36/36)
        run: |
          python scripts/verify_vocab_alignment.py

      - name: Run Production Serving & Model Test Suite
        run: |
          python -m unittest \
            tests/test_api_quote.py \
            tests/test_api_v3_quote.py \
            tests/test_aws_client.py \
            tests/test_benchmark_integrity.py \
            tests/test_cohort_lookup.py \
            tests/test_conformal_calibration.py \
            tests/test_db_and_strategy.py \
            tests/test_db_audit.py \
            tests/test_engine_determinism.py \
            tests/test_evaluator.py \
            tests/test_feature_engineering.py \
            tests/test_guardrails.py \
            tests/test_label_purity.py \
            tests/test_oof_benchmark.py \
            tests/test_pit_features.py \
            tests/test_policy_guardrails.py \
            tests/test_preprocess_validation.py \
            tests/test_scenarios_t1_t15.py \
            tests/test_strategy_tiers.py \
            tests/test_taxonomy.py \
            tests/test_tiers.py

  deploy-aws:
    name: Package & Deploy to AWS Free Tier
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync Model Artifacts & Cleaned Datasets to S3
        env:
          S3_DATA_BUCKET: ${{ vars.S3_DATA_BUCKET || secrets.S3_DATA_BUCKET }}
        run: |
          echo "Uploading trained ML models and datasets to S3 bucket: $S3_DATA_BUCKET"
          aws s3 sync models/ "s3://${S3_DATA_BUCKET}/models/" --delete
          aws s3 sync data/processed/ "s3://${S3_DATA_BUCKET}/data/processed/" --delete

      - name: Build Lambda Deployment Package
        run: |
          echo "Building Lambda serverless zip artifact..."
          mkdir -p build_package
          
          # Install stripped production dependencies for Lambda
          pip install --no-cache-dir --target=build_package -r requirements-lambda.txt

          # Clean non-runtime assets from python packages to stay well under the 250MB unzipped AWS limit
          find build_package -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
          find build_package -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
          find build_package -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find build_package -name "*.pyc" -delete 2>/dev/null || true
          find build_package -name "*.pyo" -delete 2>/dev/null || true
          find build_package -name "*.dist-info" -exec rm -rf {} + 2>/dev/null || true
          find build_package -name "*.egg-info" -exec rm -rf {} + 2>/dev/null || true

          # Copy core application code, handler, models, and metadata
          cp -r src build_package/
          cp -r models build_package/
          cp lambda_handler.py build_package/

          # Clean any stray pycache from copied code
          find build_package/src -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true

          # Package zip
          cd build_package
          zip -9 -q -r ../lambda_artifact.zip .
          cd ..
          ls -lh lambda_artifact.zip
          echo "Unzipped size (bytes):"
          du -sb build_package || du -sk build_package

      - name: Upload Lambda Package to S3
        env:
          S3_DATA_BUCKET: ${{ vars.S3_DATA_BUCKET || secrets.S3_DATA_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'ap-southeast-2' }}
        run: |
          echo "Target Bucket: $S3_DATA_BUCKET in $AWS_REGION"
          aws s3 cp lambda_artifact.zip "s3://${S3_DATA_BUCKET}/builds/lambda_artifact.zip" --region "$AWS_REGION"
          echo "S3 upload completed successfully!"

      - name: Update Lambda Function Code
        env:
          S3_DATA_BUCKET: ${{ vars.S3_DATA_BUCKET || secrets.S3_DATA_BUCKET }}
          LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME || secrets.LAMBDA_FUNCTION_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'ap-southeast-2' }}
        run: |
          set +e
          echo "=========================================================="
          echo "AWS Region  : $AWS_REGION"
          echo "S3 Bucket   : $S3_DATA_BUCKET"
          echo "Lambda Name : $LAMBDA_FUNCTION_NAME"
          echo "=========================================================="

          echo "[1/4] Checking IAM Caller Identity:"
          aws sts get-caller-identity
          
          echo "[2/4] Testing lambda:GetFunction:"
          aws lambda get-function --function-name "$LAMBDA_FUNCTION_NAME" --region "$AWS_REGION" --query "Configuration.[FunctionName,Runtime,Handler,State,LastUpdateStatus]"
          GET_STATUS=$?
          echo "get-function status: $GET_STATUS"

          echo "[2.5/4] Checking and syncing Lambda configuration (Runtime: python3.12, Handler: lambda_handler.handler)..."
          CURRENT_RUNTIME=$(aws lambda get-function-configuration --function-name "$LAMBDA_FUNCTION_NAME" --region "$AWS_REGION" --query "Runtime" --output text 2>/dev/null || echo "unknown")
          CURRENT_HANDLER=$(aws lambda get-function-configuration --function-name "$LAMBDA_FUNCTION_NAME" --region "$AWS_REGION" --query "Handler" --output text 2>/dev/null || echo "unknown")
          echo "Current Runtime: $CURRENT_RUNTIME, Current Handler: $CURRENT_HANDLER"
          
          if [ "$CURRENT_RUNTIME" != "python3.12" ] || [ "$CURRENT_HANDLER" != "lambda_handler.handler" ]; then
            echo "Updating Lambda runtime to python3.12 and handler to lambda_handler.handler..."
            aws lambda update-function-configuration \
              --function-name "$LAMBDA_FUNCTION_NAME" \
              --runtime python3.12 \
              --handler lambda_handler.handler \
              --timeout 30 \
              --memory-size 512 \
              --region "$AWS_REGION" 2>&1 || echo "::warning::Could not automatically update runtime/handler via CLI (IAM user may lack lambda:UpdateFunctionConfiguration). If needed, update Runtime to Python 3.12 and Handler to lambda_handler.handler in AWS Console."
            aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION_NAME" --region "$AWS_REGION" 2>/dev/null || true
          fi

          echo "[3/4] Updating Lambda function code from S3:"
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --s3-bucket "$S3_DATA_BUCKET" \
            --s3-key "builds/lambda_artifact.zip" \
            --region "$AWS_REGION"
          UPDATE_STATUS=$?
          echo "update-function-code status: $UPDATE_STATUS"

          if [ $UPDATE_STATUS -ne 0 ]; then
            echo "ERROR: update-function-code failed with exit code $UPDATE_STATUS"
            exit $UPDATE_STATUS
          fi

          set -e
          echo "[4/4] Waiting for function update to finish..."
          aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION_NAME" --region "$AWS_REGION"
          echo "=========================================================="
          echo "SUCCESS: Air Export Pricing Engine deployed to Lambda!"
          echo "=========================================================="

      - name: Invalidate CloudFront Cache (Optional)
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID || secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          echo "Invalidating CloudFront CDN cache for distribution: $CLOUDFRONT_DISTRIBUTION_ID"
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
